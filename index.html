<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Drum Loop Sequencer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      padding: 16px;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    h2 { margin: 0 0 16px 0; text-align: center; font-size: 20px; letter-spacing: 0.5px; }

    .panel {
      background: #1a1f2c;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .field {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 95px;
    }
    label { font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
    input, select {
      background: #0f1117;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }
    button.play-btn {
      flex: 2;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    button.play-btn.playing { background: #dc2626; }
    button.toms-btn {
      flex: 1;
      background: #334155;
      color: #fff;
      font-weight: 600;
      padding: 12px;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .grid-container {
      background: #1a1f2c;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 14px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: fit-content;
    }
    .track-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .track-label {
      width: 70px;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      flex-shrink: 0;
    }
    .step-btn {
      width: 32px;
      height: 40px;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #1e293b;
      flex-shrink: 0;
      cursor: pointer;
    }
    .step-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
    }
    .step-btn.current {
      box-shadow: 0 0 0 2px #facc15;
      filter: brightness(1.3);
    }
    /* Visuelt skille mellom hver takt/gruppe */
    .step-btn.beat-divider {
      margin-left: 8px;
      border-left: 2px solid #64748b;
    }
  </style>
</head>
<body>
  <h2>Drum Sequencer</h2>

  <div class="panel">
    <div class="row-controls">
      <div class="field">
        <label>Tempo: <span id="bpmLabel">120</span> BPM</label>
        <input type="range" id="bpm" min="50" max="220" value="120">
      </div>
      <div class="field">
        <label>Time Sig</label>
        <select id="timeSignature">
          <option value="4">4/4 (Beat: 4 steps)</option>
          <option value="3">3/4 (Beat: 3 steps)</option>
          <option value="5">5/4 (Beat: 5 steps)</option>
          <option value="7">7/8 (Beat: 7 steps)</option>
          <option value="custom">Custom...</option>
        </select>
      </div>
      <div class="field" id="customField" style="display:none;">
        <label>Steps / Beat</label>
        <input type="number" id="customSteps" min="2" max="16" value="4">
      </div>
      <div class="field">
        <label>Bars</label>
        <select id="barsCount">
          <option value="1">1 Bar</option>
          <option value="2">2 Bars</option>
          <option value="4" selected>4 Bars</option>
        </select>
      </div>
    </div>

    <div class="btn-group">
      <button id="playBtn" class="play-btn">Start Loop</button>
      <button id="toggleTomsBtn" class="toms-btn">+ Toms</button>
    </div>
  </div>

  <div class="grid-container">
    <div class="grid" id="grid"></div>
  </div>

  <script>
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Kraftige analog-stil synthesizere med 100% pålitelighet offline/mobil
    function createNoiseBuffer(ctx) {
      const bufferSize = ctx.sampleRate * 1.5;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    let noiseBuffer = null;

    function playSound(type) {
      const ctx = getAudioContext();
      const t = ctx.currentTime;
      if (!noiseBuffer) noiseBuffer = createNoiseBuffer(ctx);

      if (type === 'Kick') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(32, t + 0.28);
        gain.gain.setValueAtTime(1.0, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.3);
      } 
      else if (type === 'Snare') {
        // Tonal body
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(50, t + 0.12);
        oscGain.gain.setValueAtTime(0.6, t);
        oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.12);

        // Noise snap
        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(800, t);
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.8, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(t);
        noise.stop(t + 0.18);
      } 
      else if (type === 'HiHat') {
        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(7000, t);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.5, t);
        gain.gain.exponentialRampToValueAtTime(0.005, t + 0.05);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(t);
        noise.stop(t + 0.05);
      }
      else if (type === 'Ride') {
        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(5000, t);
        filter.Q.setValueAtTime(4, t);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.005, t + 0.5);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(t);
        noise.stop(t + 0.5);
      }
      else if (type === 'Crash') {
        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(2500, t);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.7, t);
        gain.gain.exponentialRampToValueAtTime(0.005, t + 0.9);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(t);
        noise.stop(t + 0.9);
      }
      else if (type.includes('Tom')) {
        let baseFreq = 90;
        if (type === 'High Tom') baseFreq = 160;
        if (type === 'Mid Tom') baseFreq = 120;
        if (type === 'Low Tom') baseFreq = 80;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(baseFreq * 1.5, t);
        osc.frequency.exponentialRampToValueAtTime(baseFreq, t + 0.2);
        gain.gain.setValueAtTime(0.8, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.25);
      }
    }

    // Oppsett for spor og taktart
    const baseTracks = ['Crash', 'Ride', 'HiHat', 'Snare', 'Kick'];
    const tomTracks = ['High Tom', 'Mid Tom', 'Low Tom'];
    let showToms = false;

    let stepsPerBeat = 4;
    let bars = 4;
    let totalSteps = 16;
    let pattern = {};
    let isPlaying = false;
    let currentStep = 0;
    let timerId = null;

    function getActiveTracks() {
      if (showToms) {
        return ['Crash', 'Ride', 'HiHat', 'High Tom', 'Mid Tom', 'Low Tom', 'Snare', 'Kick'];
      }
      return baseTracks;
    }

    function updateTotalSteps() {
      totalSteps = stepsPerBeat * bars;
      const tracks = getActiveTracks();
      tracks.forEach(track => {
        if (!pattern[track]) {
          pattern[track] = Array(totalSteps).fill(false);
        } else {
          const old = pattern[track];
          pattern[track] = Array.from({ length: totalSteps }, (_, i) => old[i] || false);
        }
      });
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const tracks = getActiveTracks();

      tracks.forEach(track => {
        const row = document.createElement('div');
        row.className = 'track-row';

        const label = document.createElement('span');
        label.className = 'track-label';
        label.textContent = track;
        row.appendChild(label);

        for (let i = 0; i < totalSteps; i++) {
          const btn = document.createElement('button');
          btn.className = `step-btn ${pattern[track][i] ? 'active' : ''}`;
          
          // Visuelt skille ved starten av hver takt/beat (unntatt første trinn)
          if (i > 0 && i % stepsPerBeat === 0) {
            btn.classList.add('beat-divider');
          }

          btn.dataset.track = track;
          btn.dataset.step = i;
          btn.onclick = () => {
            getAudioContext();
            pattern[track][i] = !pattern[track][i];
            btn.classList.toggle('active');
          };
          row.appendChild(btn);
        }
        grid.appendChild(row);
      });
    }

    function tick() {
      const prevStep = (currentStep - 1 + totalSteps) % totalSteps;
      document.querySelectorAll(`[data-step="${prevStep}"]`).forEach(el => el.classList.remove('current'));
      document.querySelectorAll(`[data-step="${currentStep}"]`).forEach(el => el.classList.add('current'));

      const tracks = getActiveTracks();
      tracks.forEach(track => {
        if (pattern[track]?.[currentStep]) {
          playSound(track);
        }
      });

      currentStep = (currentStep + 1) % totalSteps;

      const bpm = parseInt(document.getElementById('bpm').value, 10);
      const stepDurationMs = (60 / bpm / 4) * 1000;
      if (isPlaying) {
        timerId = setTimeout(tick, stepDurationMs);
      }
    }

    // Playback-knapp
    document.getElementById('playBtn').onclick = () => {
      const ctx = getAudioContext();
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');

      if (isPlaying) {
        btn.textContent = 'Stop Loop';
        btn.classList.add('playing');
        tick();
      } else {
        btn.textContent = 'Start Loop';
        btn.classList.remove('playing');
        clearTimeout(timerId);
        document.querySelectorAll('.current').forEach(el => el.classList.remove('current'));
        currentStep = 0;
      }
    };

    // Toggle Toms
    document.getElementById('toggleTomsBtn').onclick = () => {
      getAudioContext();
      showToms = !showToms;
      document.getElementById('toggleTomsBtn').textContent = showToms ? '- Remove Toms' : '+ Toms';
      updateTotalSteps();
      renderGrid();
    };

    // Tempo slider
    document.getElementById('bpm').oninput = (e) => {
      document.getElementById('bpmLabel').textContent = e.target.value;
    };

    // Taktart-velger
    document.getElementById('timeSignature').onchange = (e) => {
      const val = e.target.value;
      const customField = document.getElementById('customField');
      if (val === 'custom') {
        customField.style.display = 'flex';
        stepsPerBeat = parseInt(document.getElementById('customSteps').value, 10) || 4;
      } else {
        customField.style.display = 'none';
        stepsPerBeat = parseInt(val, 10);
      }
      currentStep = 0;
      updateTotalSteps();
      renderGrid();
    };

    document.getElementById('customSteps').onchange = (e) => {
      stepsPerBeat = Math.max(2, parseInt(e.target.value, 10) || 4);
      currentStep = 0;
      updateTotalSteps();
      renderGrid();
    };

    // Antall takter (Bars)
    document.getElementById('barsCount').onchange = (e) => {
      bars = parseInt(e.target.value, 10);
      currentStep = 0;
      updateTotalSteps();
      renderGrid();
    };

    // Initial oppstart
    updateTotalSteps();
    renderGrid();
  </script>
</body>
</html>
