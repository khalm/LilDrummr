<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LilDrummr</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="android-pwa-192.png">
  <meta name="theme-color" content="#0f1117">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      padding: 16px;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    h2 { 
      margin: 0 0 16px 0; 
      text-align: center; 
      font-size: 22px; 
      letter-spacing: 1px;
      font-weight: 800;
      color: #60a5fa;
    }

    .panel {
      background: #1a1f2c;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .field {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 95px;
    }
    label { font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
    input, select {
      background: #0f1117;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }
    button.play-btn {
      flex: 2;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      padding: 12px 8px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button.play-btn.playing { background: #dc2626; }
    button.secondary-btn {
      flex: 1;
      background: #334155;
      color: #fff;
      font-weight: 600;
      padding: 12px 6px;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button.clear-btn {
      background: #3f1d24;
      border-color: #831843;
      color: #fca5a5;
    }
    button.clear-btn:active {
      background: #991b1b;
      color: #fff;
    }

    .hint {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: -4px;
    }

    .grid-container {
      background: #1a1f2c;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 14px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: fit-content;
    }
    .track-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .track-label {
      width: 82px;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      flex-shrink: 0;
    }
    .step-btn {
      width: 32px;
      height: 40px;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #1e293b;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
    }
    .step-btn.accent-full {
      background: #2563eb;
      border-color: #60a5fa;
    }
    .step-btn.accent-soft {
      background: #7c3aed;
      border-color: #a78bfa;
    }
    .step-btn.accent-soft::after {
      content: "•";
      color: #fff;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
    }

    .step-btn.current {
      box-shadow: 0 0 0 2px #facc15;
      filter: brightness(1.3);
    }
    .step-btn.beat-divider {
      margin-left: 8px;
      border-left: 2px solid #64748b;
    }
  </style>
</head>
<body>
  <h2>LilDrummr</h2>

  <div class="panel">
    <div class="row-controls">
      <div class="field">
        <label>Tempo: <span id="bpmLabel">120</span> BPM</label>
        <input type="range" id="bpm" min="50" max="220" value="120">
      </div>
      <div class="field">
        <label>Time Sig</label>
        <select id="timeSignature">
          <option value="4">4/4 (Beat: 4 steps)</option>
          <option value="3">3/4 (Beat: 3 steps)</option>
          <option value="5">5/4 (Beat: 5 steps)</option>
          <option value="7">7/8 (Beat: 7 steps)</option>
          <option value="custom">Custom...</option>
        </select>
      </div>
      <div class="field" id="customField" style="display:none;">
        <label>Steps / Beat</label>
        <input type="number" id="customSteps" min="2" max="16" value="4">
      </div>
      <div class="field">
        <label>Bars</label>
        <select id="barsCount">
          <option value="1">1 Bar</option>
          <option value="2">2 Bars</option>
          <option value="4" selected>4 Bars</option>
        </select>
      </div>
    </div>

    <div class="btn-group">
      <button id="playBtn" class="play-btn">Start Loop</button>
      <button id="toggleTomsBtn" class="secondary-btn">+ Toms</button>
      <button id="clearBtn" class="secondary-btn clear-btn">Clear</button>
    </div>
    <div class="hint">Tap = Full hit | Hold = Ghost note (soft)</div>
  </div>

  <div class="grid-container">
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const sampleFiles = {
      'Kick': 'samples/kick.wav',
      'Snare': 'samples/snare.wav',
      'HatClosed': 'samples/hhCl.wav',
      'HatOpen': 'samples/hhOp.wav',
      'Ride': 'samples/ride.wav',
      'Crash': 'samples/crash.wav',
      'Tom1': 'samples/tom1.wav',
      'Tom2': 'samples/tom2.wav',
      'Tom3': 'samples/tom3.wav'
    };

    const audioBuffers = {};
    let samplesLoaded = false;
    let openHiHatGain = null;

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    async function preloadSamples() {
      if (samplesLoaded) return;
      const ctx = getAudioContext();

      for (const [track, path] of Object.entries(sampleFiles)) {
        try {
          const res = await fetch(path);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            audioBuffers[track] = await ctx.decodeAudioData(buf);
          }
        } catch (e) {
          console.warn(`Could not load ${path}:`, e);
        }
      }
      samplesLoaded = true;
    }

    function playSound(type, velocity = 1.0) {
      const ctx = getAudioContext();
      const t = ctx.currentTime;

      if (type === 'HatClosed' && openHiHatGain) {
        openHiHatGain.gain.cancelScheduledValues(t);
        openHiHatGain.gain.setValueAtTime(openHiHatGain.gain.value, t);
        openHiHatGain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
      }

      if (audioBuffers[type]) {
        const src = ctx.createBufferSource();
        src.buffer = audioBuffers[type];
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(velocity, t);
        src.connect(gain);
        gain.connect(ctx.destination);
        src.start(t);

        if (type === 'HatOpen') {
          openHiHatGain = gain;
        }
      }
    }

    const baseTracks = ['Kick', 'Snare', 'HatClosed', 'HatOpen', 'Ride', 'Crash'];
    const tomTracks = ['Tom1', 'Tom2', 'Tom3'];
    let showToms = false;

    let stepsPerBeat = 4;
    let bars = 4;
    let totalSteps = 16;
    
    let pattern = {};
    let isPlaying = false;
    let currentStep = 0;
    let timerId = null;

    function getActiveTracks() {
      return showToms ? [...baseTracks, ...tomTracks] : baseTracks;
    }

    function updateTotalSteps() {
      totalSteps = stepsPerBeat * bars;
      const tracks = getActiveTracks();
      tracks.forEach(track => {
        if (!pattern[track]) {
          pattern[track] = Array(totalSteps).fill(0);
        } else {
          const old = pattern[track];
          pattern[track] = Array.from({ length: totalSteps }, (_, i) => old[i] || 0);
        }
      });
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const tracks = getActiveTracks();

      tracks.forEach(track => {
        const row = document.createElement('div');
        row.className = 'track-row';

        const label = document.createElement('span');
        label.className = 'track-label';
        label.textContent = track;
        row.appendChild(label);

        for (let i = 0; i < totalSteps; i++) {
          const btn = document.createElement('button');
          btn.className = 'step-btn';
          
          const val = pattern[track][i];
          if (val === 1) btn.classList.add('accent-full');
          if (val === 2) btn.classList.add('accent-soft');

          if (i > 0 && i % stepsPerBeat === 0) {
            btn.classList.add('beat-divider');
          }

          btn.dataset.track = track;
          btn.dataset.step = i;

          let pressTimer = null;
          let isLongPress = false;

          const startPress = () => {
            getAudioContext();
            preloadSamples();
            isLongPress = false;
            pressTimer = setTimeout(() => {
              isLongPress = true;
              pattern[track][i] = 2;
              btn.className = 'step-btn accent-soft' + (i > 0 && i % stepsPerBeat === 0 ? ' beat-divider' : '');
              playSound(track, 0.35);
              if (navigator.vibrate) navigator.vibrate(25);
            }, 350);
          };

          const endPress = () => {
            clearTimeout(pressTimer);
            if (!isLongPress) {
              if (pattern[track][i] === 0) {
                pattern[track][i] = 1;
                btn.className = 'step-btn accent-full' + (i > 0 && i % stepsPerBeat === 0 ? ' beat-divider' : '');
                playSound(track, 1.0);
              } else {
                pattern[track][i] = 0;
                btn.className = 'step-btn' + (i > 0 && i % stepsPerBeat === 0 ? ' beat-divider' : '');
              }
            }
          };

          btn.addEventListener('pointerdown', startPress);
          btn.addEventListener('pointerup', endPress);
          btn.addEventListener('pointercancel', () => clearTimeout(pressTimer));

          row.appendChild(btn);
        }
        grid.appendChild(row);
      });
    }

    function tick() {
      const prevStep = (currentStep - 1 + totalSteps) % totalSteps;
      document.querySelectorAll(`[data-step="${prevStep}"]`).forEach(el => el.classList.remove('current'));
      document.querySelectorAll(`[data-step="${currentStep}"]`).forEach(el => el.classList.add('current'));

      const tracks = getActiveTracks();
      tracks.forEach(track => {
        const val = pattern[track]?.[currentStep];
        if (val === 1) playSound(track, 1.0);
        else if (val === 2) playSound(track, 0.35);
      });

      currentStep = (currentStep + 1) % totalSteps;

      const bpm = parseInt(document.getElementById('bpm').value, 10);
      const stepDurationMs = (60 / bpm / 4) * 1000;
      if (isPlaying) {
        timerId = setTimeout(tick, stepDurationMs);
      }
    }

    document.getElementById('playBtn').onclick = () => {
      getAudioContext();
      preloadSamples();
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');

      if (isPlaying) {
        btn.textContent = 'Stop Loop';
        btn.classList.add('playing');
        tick();
      } else {
        btn.textContent = 'Start Loop';
        btn.classList.remove('playing');
        clearTimeout(timerId);
        document.querySelectorAll('.current').forEach(el => el.classList.remove('current'));
        currentStep = 0;
      }
    };

    document.getElementById('toggleTomsBtn').onclick = () => {
      getAudioContext();
      preloadSamples();
      showToms = !showToms;
      document.getElementById('toggleTomsBtn').textContent = showToms ? '- Toms' : '+ Toms';
      updateTotalSteps();
      renderGrid();
    };

    document.getElementById('clearBtn').onclick = () => {
      const tracks = getActiveTracks();
      tracks.forEach(track => {
        pattern[track] = Array(totalSteps).fill(0);
      });
      renderGrid();
    };

    document.getElementById('bpm').oninput = (e) => {
      document.getElementById('bpmLabel').textContent = e.target.value;
    };

    document.getElementById('timeSignature').onchange = (e) => {
      const val = e.target.value;
      const customField = document.getElementById('customField');
      if (val === 'custom') {
        customField.style.display = 'flex';
        stepsPerBeat = parseInt(document.getElementById('customSteps').value, 10) || 4;
      } else {
        customField.style.display = 'none';
        stepsPerBeat = parseInt(val, 10);
      }
      currentStep = 0;
      updateTotalSteps();
      renderGrid();
    };

    document.getElementById('customSteps').onchange = (e) => {
      stepsPerBeat = Math.max(2, parseInt(e.target.value, 10) || 4);
      currentStep = 0;
      updateTotalSteps();
      renderGrid();
    };

    document.getElementById('barsCount').onchange = (e) => {
      bars = parseInt(e.target.value, 10);
      currentStep = 0;
      updateTotalSteps();
      renderGrid();
    };

    updateTotalSteps();
    renderGrid();
  </script>
</body>
</html>
